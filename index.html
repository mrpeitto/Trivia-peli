<html>
    <head>
        <title>Trivial pursuit peli</title>
        <link rel="stylesheet" href="styles.css">
        <script src= "game.js" defer></script>
    </head>
    <body>
        <header class="game-header">
            <h1>Trivia peli</h1>
            <p>Kerää kaikki kategoriat</p>
        </header>

        <section class="status-panel">
            <article class="player-card">
                <h2>Pelaaja</h2>
                <p>Kerätyt aihealueet: 0/6</p>
                <img src="me triple t bigboss.jpeg" class="player-image">
            </article>

            <article class="dice-panel">
                <p>Vuorossa:</p>
                <h2>Pelaaja</h2>
                <button>Heitä noppaa</button>

                <div id="board" class="board">tähän tulee pelilauta</div>
            </article>

            <article class="player-card">
                <h2>Chatgpt</h2>
                <p>Kerätyt aihealueet: 0/6</p>
                <img src="chatgpt.png" class="player-image">
            </article>
        </section>
    </body>
</html>
